name: reusable-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2
        with:
          tool: cargo-deny@0.19.4
      - name: Dependency policy
        run: cargo deny check advisories licenses sources bans

  quality-check:
    needs: dependency-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2
        with:
          tool: cargo-llvm-cov@0.8.5
      - uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2
        with:
          tool: covgate@0.2.0
      - uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2
        with:
          tool: cargo-machete@0.9.2
      - name: Format
        id: format
        run: cargo fmt --check
      - name: Clippy
        id: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Dependency hygiene
        id: dependency_hygiene
        if: ${{ !cancelled() }}
        run: cargo machete
      - name: Dogfood lint
        id: dogfood_lint
        if: ${{ !cancelled() }}
        run: cargo run --locked -- lint .
      - name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: cargo llvm-cov --locked --json --output-path target/coverage.json --ignore-filename-regex 'src/bin/dg\.rs$'
      - name: Covgate
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: covgate check target/coverage.json
