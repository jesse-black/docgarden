name: reusable-ci

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2
        with:
          tool: cargo-llvm-cov@0.8.5
      - uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2
        with:
          tool: covgate@0.2.0
      - name: Format
        id: format
        run: cargo fmt --check
      - name: Clippy
        id: clippy
        if: ${{ always() }}
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Coverage
        id: coverage
        if: ${{ always() }}
        run: cargo llvm-cov --json --output-path target/coverage.json
      - name: Covgate
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        run: covgate check target/coverage.json --markdown-output "$GITHUB_STEP_SUMMARY"

  dependency-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2
        with:
          tool: cargo-machete@0.9.2
      - name: Dependency hygiene
        run: cargo machete

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1 # v2
        with:
          tool: cargo-deny@0.19.4
      - name: Dependency policy
        run: cargo deny check advisories licenses sources bans

  dogfood-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Dogfood lint
        run: cargo run -- lint .
