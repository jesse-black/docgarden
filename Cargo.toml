[package]
name = "docgarden"
version = "0.1.0"
edition = "2024"
description = "Repository knowledge tooling for agentic engineering repositories"
license = "Apache-2.0"
repository = "https://github.com/jesse-black/docgarden"
readme = "README.md"
keywords = ["agents", "linter", "markdown", "documentation", "repository"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE*",
]

[lints]
workspace = true

[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
markdown = "1.0.0"
rust-stemmers = "1.2"
serde = { version = "1.0", features = ["derive"] }
tiktoken-rs = "0.11"
toml = "1.1"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
