exclude = [
    "tests/**",
]

[[rules]]
path = "**/*.md"

[rules.frontmatter.fields.description]
max_chars = 1024

[[rules]]
path = "**/*.md"
exclude = ["AGENTS.md", "README.md"]

[rules.frontmatter]
required = ["description"]

[[rules]]
path = "AGENTS.md"
max_lines = 100
max_tokens = 1000

[[rules]]
path = "SKILL.md"
max_lines = 500
max_tokens = 5000

[[rules]]
path = "docs/exec-plans/completed/**"
disable = ["unresolved-link-path"]
reason = "Completed ExecPlans are archival records and may preserve historical paths."

[[rules]]
path = "docs/references/**"
disable = ["unresolved-link-path"]
reason = "References are clippings of external sources and must remain untouched."
