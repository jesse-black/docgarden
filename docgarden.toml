exclude = [
    "tests/**",
]

[[documents]]
name = "completed-execplans"
match = "docs/exec-plans/completed/**"

[[documents]]
name = "references"
match = "docs/references/**"
kind = "reference"

[[rules]]
match = "README.md"
disable = ["prefer-backticks-for-local-paths"]
reason = "Allow local links in README.md because it is human-facing documentation."

[[rules]]
match = "completed-execplans"
disable = ["unresolved-local-path"]
reason = "Completed ExecPlans are archival records and may preserve historical paths."

[[rules]]
match = "references"
disable = ["unresolved-local-path"]
reason = "References are clippings of external sources and may preserve source-derived paths."
