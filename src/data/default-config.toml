skills-dir = ".agents/skills"
plans-dir = "docs/exec-plans"

[[rules]]
path = "*.md"

[rules.frontmatter.fields.description]
max-chars = 1024

[[rules]]
path = "*.md"
exclude = ["AGENTS.md", "CLAUDE.md", "GEMINI.md", "README.md"]

[rules.frontmatter]
required = ["description"]

[[rules]]
path = "AGENTS.md"
max-lines = 100
max-tokens = 1000

[[rules]]
path = "SKILL.md"
max-lines = 500
max-tokens = 5000

[rules.frontmatter]
required = ["name", "description"]
